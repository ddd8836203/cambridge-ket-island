<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🏝️ 動森 KET 13盾衝刺島 (Cambridge A2 Key for Schools)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="layout-ipad-102">
  <!-- 粒子特效層 -->
  <div id="ac-fx-layer" class="ac-fx-layer" aria-hidden="true"></div>

  <!-- 主外殼容器 -->
  <div id="ac-app-shell" class="ac-app-shell">
    
    <!-- 頂部常駐導覽列 -->
    <header class="ac-topbar" id="ac-topbar">
      <!-- 品牌標題與單元切換 -->
      <div class="topbar-left">
        <div class="ac-brand">
          <span class="ac-island-icon">🏝️</span>
          <div class="ac-brand-text">
            <h1 class="ac-brand-title">動森 KET 13盾衝刺島</h1>
            <span class="ac-brand-sub">Cambridge A2 Key Preparation</span>
          </div>
        </div>

        <div class="unit-selector-capsules" id="unit-selector-capsules">
          <button class="unit-capsule active" data-unit="all">全部 U1~3</button>
          <button class="unit-capsule" data-unit="u1">U1 人物</button>
          <button class="unit-capsule" data-unit="u2">U2 休閒</button>
          <button class="unit-capsule" data-unit="u3">U3 美食</button>
        </div>
      </div>

      <!-- 控制項：帳號、哩數、多設備切換、雲端、字級、音效 -->
      <div class="topbar-right">
        <!-- 4 帳號快速切換膠囊 -->
        <div class="account-capsules" id="account-capsules">
          <button class="acc-btn active" data-account="rex" id="acc-rex" title="Rex (6年級) - 15盾目標生">
            <span class="acc-avatar">🦁</span>
            <span class="acc-name">Rex (6年)</span>
          </button>
          <button class="acc-btn" data-account="hugo" id="acc-hugo" title="Hugo (5年級) - 字根詞性強化模式">
            <span class="acc-avatar">🐯</span>
            <span class="acc-name">Hugo (5年)</span>
          </button>
          <button class="acc-btn" data-account="test1" id="acc-test1" title="家長測試 1 - 驗證沙盒">
            <span class="acc-avatar">🧪</span>
            <span class="acc-name">測試1</span>
          </button>
          <button class="acc-btn" data-account="test2" id="acc-test2" title="訪客測試 2 - 演練展示">
            <span class="acc-avatar">🛠️</span>
            <span class="acc-name">測試2</span>
          </button>
        </div>

        <!-- 哩數積分顯示 -->
        <div class="nook-miles-badge" id="nook-miles-badge" title="目前累積動森哩數">
          <span class="nook-leaf">🍃</span>
          <span class="nook-miles-val" id="topbar-miles-display">350</span>
          <span class="nook-miles-unit">哩</span>
        </div>

        <!-- 多設備模式切換鈕 (電腦全寬 + 雙 iPad + iPhone 15 Pro) -->
        <div class="device-layout-controls" id="device-layout-controls">
          <button class="ac-btn-icon" id="btn-layout-desktop" title="切換至電腦寬螢幕模式 (最大 1520px)">
            💻 電腦
          </button>
          <button class="ac-btn-icon active" id="btn-layout-102" title="切換至 iPad 10.2吋 橫向模式 (1080×810)">
            📱 10.2"
          </button>
          <button class="ac-btn-icon" id="btn-layout-129" title="切換至 iPad Pro 12.9吋 橫向模式 (1366×1024)">
            🖥️ 12.9"
          </button>
          <button class="ac-btn-icon" id="btn-layout-15pro" data-layout="layout-iphone-15pro" title="切換至 iPhone 15 Pro 直向模式 (393×852)">
            📲 15 Pro
          </button>
        </div>

        <!-- 雲端雙向同步按鈕與狀態指示 (Firebase /ket_prep_v1_users/) -->
        <button class="ac-btn-icon cloud-sync-btn" id="btn-cloud-sync" title="點擊立即手動與 Firebase 雲端雙向同步" onclick="syncFromCloud(AppState.currentAccount, true)">
          <span id="cloud-sync-status-icon">🟢</span>
          <span id="cloud-sync-status-text">已同步</span>
        </button>

        <!-- 5 段字級縮放控制 -->
        <div class="font-scale-controls">
          <button class="ac-btn-icon" id="btn-font-down" title="縮小字級 (最小 90%)">A-</button>
          <span class="font-scale-label" id="font-scale-label">100%</span>
          <button class="ac-btn-icon" id="btn-font-up" title="放大字級 (最大 140%)">A+</button>
        </div>

        <!-- 音效開關 -->
        <button class="ac-btn-icon sfx-toggle" id="btn-sfx-toggle" title="切換 Web Audio 合成音效開關">
          🔊 音效開
        </button>
      </div>
    </header>

    <!-- 主功能分頁導覽列（支援電腦多排免滑 / 滾輪橫移 / 左右箭頭切換） -->
    <div class="ac-nav-tabs-bar" id="ac-nav-tabs-bar">
      <button class="nav-scroll-arrow" id="btn-nav-scroll-left" title="向左捲動分頁" aria-label="向左捲動分頁">◀</button>
      <nav class="ac-nav-tabs" id="ac-nav-tabs">
        <button class="nav-tab active" data-tab="dashboard" id="tab-dashboard">
          <span class="tab-icon">🏝️</span>
          <span class="tab-label">戰情室</span>
        </button>
        <button class="nav-tab" data-tab="arena" id="tab-arena">
          <span class="tab-icon">🎯</span>
          <span class="tab-label">KET 全真題庫</span>
        </button>
        <button class="nav-tab" data-tab="vocab" id="tab-vocab">
          <span class="tab-icon">🃏</span>
          <span class="tab-label">單字 (58)</span>
        </button>
        <button class="nav-tab" data-tab="mistakes" id="tab-mistakes">
          <span class="tab-icon">🪲</span>
          <span class="tab-label">抓蟲 (35)</span>
        </button>
        <button class="nav-tab" data-tab="spreads" id="tab-spreads">
          <span class="tab-icon">🗺️</span>
          <span class="tab-label">課本原圖</span>
        </button>
        <button class="nav-tab" data-tab="rw" id="tab-rw">
          <span class="tab-icon">📖</span>
          <span class="tab-label">閱寫 & 複習</span>
        </button>
        <button class="nav-tab" data-tab="listening" id="tab-listening">
          <span class="tab-icon">🎧</span>
          <span class="tab-label">聽力劇場</span>
        </button>
        <button class="nav-tab" data-tab="speaking" id="tab-speaking">
          <span class="tab-icon">🎙️</span>
          <span class="tab-label">口說對練</span>
        </button>
        <button class="nav-tab" data-tab="errorbook" id="tab-errorbook">
          <span class="tab-icon">📕</span>
          <span class="tab-label">5色錯題本</span>
          <span class="error-badge-count" id="tab-error-count">0</span>
        </button>
        <button class="nav-tab" data-tab="print" id="tab-print">
          <span class="tab-icon">🖨️</span>
          <span class="tab-label">A4 列印</span>
        </button>
      </nav>
      <button class="nav-scroll-arrow" id="btn-nav-scroll-right" title="向右捲動分頁" aria-label="向右捲動分頁">▶</button>
    </div>

    <!-- 主視圖容器區塊 -->
    <main class="ac-main-content" id="ac-main-content">
      <!-- 1. 🏝️ 島嶼戰情室 (15 盾雷達) -->
      <section class="ac-view active" id="view-dashboard">
        <!-- 由 app.js 動態渲染 renderDashboard() -->
      </section>

      <!-- 1.5 🎯 KET 全真題庫方格考場 -->
      <section class="ac-view" id="view-arena"></section>

      <!-- 2. 🃏 單字與搭配詞學習艙 -->
      <section class="ac-view" id="view-vocab">
        <!-- 由 app.js 動態渲染 renderVocabPod() -->
      </section>

      <!-- 3. 🪲 傅達館長抓蟲特訓館 (Exam Common Mistakes) -->
      <section class="ac-view" id="view-mistakes">
        <!-- 由 app.js 動態渲染 renderMistakesPod() -->
      </section>

      <!-- 4. 🗺️ 課本跨頁原圖瀏覽器 -->
      <section class="ac-view" id="view-spreads">
        <!-- 由 app.js 動態渲染 renderSpreadViewer() -->
      </section>

      <!-- 5. 📖 閱讀與寫作考場 (Part 1~7) - Phase 4 預留 -->
      <section class="ac-view" id="view-rw">
        <!-- 由 app.js 動態渲染 renderRwPlaceholder() -->
      </section>

      <!-- 6. 🎧 雙角色聽力劇場 (Part 2~4) - Phase 4 預留 -->
      <section class="ac-view" id="view-listening">
        <!-- 由 app.js 動態渲染 renderListeningPlaceholder() -->
      </section>

      <!-- 7. 🎙️ 口說對練室 (Part 1~2) - Phase 4 預留 -->
      <section class="ac-view" id="view-speaking">
        <!-- 由 app.js 動態渲染 renderSpeakingPlaceholder() -->
      </section>

      <!-- 8. 📕 5色錯題熱力本 (即時顯示 netErrors 錯題) -->
      <section class="ac-view" id="view-errorbook">
        <!-- 由 app.js 動態渲染 renderErrorBookView() -->
      </section>

      <!-- 9. 🖨️ A4 考卷列印引擎 - Phase 5 預留 -->
      <section class="ac-view" id="view-print">
        <!-- 由 app.js 動態渲染 renderPrintPlaceholder() -->
      </section>
    </main>

    <!-- 底部常駐狀態資訊 -->
    <footer class="ac-footer" id="ac-footer">
      <div class="footer-left">
        <span class="footer-tag">🏝️ 動物森友會 KET 特訓系統</span>
        <span class="footer-account-indicator" id="footer-account-name">目前考生：Rex (6年級)</span>
        <span class="footer-mode-indicator" id="footer-mode-name">模式：iPad 10.2" (1080×810)</span>
      </div>
      <div class="footer-right">
        <span class="footer-note">🎯 目標：13 盾牌 (135+ 分 Merit 卓越認證)</span>
        <button class="footer-reset-btn" id="btn-switch-lock-account" onclick="openAccountLoginModal({ startup: false })" title="切換或重新驗證考生帳號">👤 換人登入</button>
        <button class="footer-reset-btn" id="btn-reset-test-account" title="重置目前帳號的測試數據">🔄 重設當前沙盒數據</button>
      </div>
    </footer>
  </div>

  <!-- 進場選帳號與密碼驗證視窗 (防止誤用帳號混淆紀錄 + 同步解鎖 iPhone 語音) -->
  <div id="ac-login-modal" class="ac-login-modal open" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
    <div class="ac-login-card" id="ac-login-card">
      <div class="ac-login-header">
        <div class="ac-login-badge">🏝️ 動森 KET 13盾衝刺島 · 登島護照查驗</div>
        <h2 id="login-modal-title" class="ac-login-title">請問今天是哪位島民要練習？</h2>
        <p class="ac-login-sub" id="login-modal-sub">請先點選自己的護照登入，才不會跟別人的錯題與盾牌混在一起喔！</p>
      </div>

      <div class="ac-login-grid" id="ac-login-grid">
        <button type="button" class="ac-login-option" data-acc="rex" id="login-card-rex" onclick="selectLoginAccount('rex')">
          <span class="ac-login-avatar">🦁</span>
          <div class="ac-login-meta">
            <strong>Rex (6年級)</strong>
            <small>15 盾衝刺主帳號</small>
          </div>
          <span class="ac-login-lock">🔒 需密碼</span>
        </button>
        <button type="button" class="ac-login-option" data-acc="hugo" id="login-card-hugo" onclick="selectLoginAccount('hugo')">
          <span class="ac-login-avatar">🐯</span>
          <div class="ac-login-meta">
            <strong>Hugo (5年級)</strong>
            <small>字根詞性強化模式</small>
          </div>
          <span class="ac-login-lock">🔒 需密碼</span>
        </button>
        <button type="button" class="ac-login-option is-sandbox" data-acc="test1" id="login-card-test1" onclick="selectLoginAccount('test1')">
          <span class="ac-login-avatar">🧪</span>
          <div class="ac-login-meta">
            <strong>測試1</strong>
            <small>家長驗證沙盒</small>
          </div>
          <span class="ac-login-lock unlocked">🔓 免密碼進入</span>
        </button>
        <button type="button" class="ac-login-option is-sandbox" data-acc="test2" id="login-card-test2" onclick="selectLoginAccount('test2')">
          <span class="ac-login-avatar">🛠️</span>
          <div class="ac-login-meta">
            <strong>測試2</strong>
            <small>訪客演練沙盒</small>
          </div>
          <span class="ac-login-lock unlocked">🔓 免密碼進入</span>
        </button>
      </div>

      <form id="login-password-panel" class="ac-login-pw-panel" style="display:none;" onsubmit="submitAccountPassword(event)">
        <label for="login-password-input" class="ac-login-pw-label" id="login-password-label">
          🔐 請輸入密碼：
        </label>
        <div class="ac-login-pw-row">
          <input
            type="password"
            id="login-password-input"
            class="ac-login-pw-input"
            placeholder="輸入英文名稱 (大小寫不限)"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
          >
          <button type="button" class="ac-btn-icon ac-login-eye-btn" id="btn-toggle-pw-vis" onclick="toggleLoginPasswordVisibility()" aria-label="顯示或隱藏密碼" title="顯示或隱藏密碼">👁️</button>
        </div>
        <div id="login-error-msg" class="ac-login-error" style="display:none;"></div>
        <div class="ac-login-pw-actions">
          <button type="submit" class="ac-btn ac-btn-green ac-login-submit-btn" id="btn-login-confirm">🏝️ 驗證並進入衝刺島</button>
          <button type="button" class="ac-btn" id="btn-login-cancel" style="display:none;" onclick="closeAccountLoginModal()">取消切換</button>
        </div>
      </form>

      <div class="ac-login-footer">
        <button type="button" class="ac-btn ac-btn-sm ac-btn-cream" id="btn-test-device-audio" onclick="testDeviceAudioFromModal()">🔊 測試 iPhone / 平板發音</button>
        <button type="button" class="ac-btn ac-btn-sm" id="btn-login-cancel-bottom" style="display:none;" onclick="closeAccountLoginModal()">取消切換</button>
        <span id="login-audio-test-status" class="ac-login-audio-status"></span>
      </div>
    </div>
  </div>

  <!-- 資料庫與主程式碼 -->
  <script src="data/ket_u1_u3.js"></script>
  <script src="data/ket_exam_bank.js"></script>
  <script src="app.js"></script>
</body>
</html>
